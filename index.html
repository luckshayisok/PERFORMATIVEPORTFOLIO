<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />

    <title>Lakshya Maheshwari — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer building IT automation and conversational AI systems — Python endpoint scripts, Rasa bots, Django APIs and Electron desktop apps."
    />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lakshya Maheshwari — Software Engineer" />
    <meta
      property="og:description"
      content="IT automation and conversational AI systems. Python, Django, Rasa, Electron, Windows endpoint automation."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- the cover figure is the LCP element and is rendered by JS, so the
         browser cannot discover it from the markup on its own -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/portrait-1080.webp"
      imagesrcset="/portrait-540.webp 540w, /portrait-810.webp 810w, /portrait-1080.webp 1080w"
      imagesizes="(max-width: 900px) 78vw, 58vw"
      fetchpriority="high"
    />

    <!-- Both typefaces preloaded so no layout shift occurs on font swap -->
    <link
      rel="preload"
      href="/fonts/jetbrains-mono-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/bodoni-moda-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/anton-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
